# Build CI — compiles the desktop installers, publishes nothing.
#
# `release.yml` was the only thing that ever ran electron-builder, and it only runs on a
# `v*` tag. So a commit that broke packaging — a file missing from electron-builder.json's
# `files` list, a native module that stops rebuilding, an icon the platform cannot read —
# stayed green until someone cut a tag and found out during a release. This closes that gap
# the same way `test.yml` closed the suite's: run it on every push, name the failure after
# the platform it happened on.
#
# It is deliberately NOT a release. `--publish never` is passed explicitly rather than
# relying on electron-builder's default policy (which publishes when it detects CI plus a
# tag) — that flag is the whole guarantee that this workflow cannot touch a GitHub Release.
#
# Node 20, matching `release.yml` rather than `test.yml`'s 22: an installer should be built
# the way a released installer is built, or this checks a configuration nobody ships.
#
# The server artifacts are here too, via the reusable `server.yml` — the Docker image, the
# standalone Linux zip and both Windows zips, each built, booted and exercised against a
# real API. `release.yml` calls that same file with `upload: true`, so the assertions this
# workflow runs on every commit are literally the ones a release runs.

name: Build

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stated rather than left to the repository default: nothing here publishes, and `server.yml`
# inherits the caller's permissions — so the workflow that runs on every branch and every
# pull request cannot write to a release even if its `upload` input were set by mistake.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    # fail-fast off so one platform's breakage does not hide another's. That is the
    # entire point of building three of them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (NSIS)
            build: npm run dist:win -- --publish never
            artifact: windows-nsis
            path: dist/*.exe
          - os: ubuntu-latest
            name: Linux (AppImage)
            build: npm run dist:linux -- --publish never
            artifact: linux-appimage
            path: dist/*.AppImage
          - os: macos-latest
            name: macOS (dmg, arm64)
            build: npm run dist:mac -- --publish never
            artifact: macos-dmg
            path: dist/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # CSC_IDENTITY_AUTO_DISCOVERY is a no-op off macOS and harmless to set everywhere.
      # On the mac runner there is no signing certificate, and without this electron-builder
      # goes looking for one in the keychain; saying so up front makes the unsigned build a
      # decision recorded here rather than a lookup that can fail for its own reasons.
      - name: Build the installer
        run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Short retention: these exist so a change can be smoke-tested on a real machine
      # before it is tagged, not as a distribution channel. The Releases page is that.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          retention-days: 7
          if-no-files-found: error

  # Every server artifact release.yml builds, minus the upload. This is the gap `test.yml`
  # documented and deliberately left open; it is closed here rather than there because it is
  # a build, not a test, and because these jobs are slow enough to want their own workflow.
  server:
    name: Server
    uses: ./.github/workflows/server.yml
    with:
      upload: false
