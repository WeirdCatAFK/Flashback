name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release and upload assets
  packages: write # push the server image to GHCR (server.yml, gated on upload: true)

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win -- --publish always
          - os: ubuntu-latest
            build: npm run dist:linux -- --publish always
          # arm64: the runner is Apple Silicon, and better-sqlite3 builds for it. An x64 package would fail at launch.
          - os: macos-latest
            build: npm run dist:mac -- --publish always
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Version OK: $PKG"

      - name: Build and publish
        run: ${{ matrix.build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  server:
    needs: release
    uses: ./.github/workflows/server.yml
    with:
      upload: true
