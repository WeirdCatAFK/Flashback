# Flashback Server. Copy .env.example to .env beside this file to set the values below.
# The first start logs the author token once. Put a TLS proxy in front: this publishes on loopback.

services:
  flashback:
    image: ghcr.io/weirdcatafk/flashback-server:${FLASHBACK_VERSION:-latest}
    restart: unless-stopped

    ports:
      - "${FLASHBACK_BIND_ADDR:-127.0.0.1}:${FLASHBACK_PORT:-50500}:${FLASHBACK_PORT:-50500}"

    environment:
      FLASHBACK_PORT: "${FLASHBACK_PORT:-50500}"
      FLASHBACK_HOST: "${FLASHBACK_HOST:-0.0.0.0}"
      FLASHBACK_VAULT_NAME: "${FLASHBACK_VAULT_NAME:-shared}"
      FLASHBACK_USER_NAME: "${FLASHBACK_USER_NAME:-Flashback Server}"
      FLASHBACK_USER_EMAIL: "${FLASHBACK_USER_EMAIL:-server@example.com}"
      FLASHBACK_ALLOWED_ORIGINS: "${FLASHBACK_ALLOWED_ORIGINS:-}"
      FLASHBACK_LOG_FORMAT: "${FLASHBACK_LOG_FORMAT:-combined}"
      FLASHBACK_UPDATE_CHECK: "${FLASHBACK_UPDATE_CHECK:-on}"
      FLASHBACK_AUTHOR_TOKEN: "${FLASHBACK_AUTHOR_TOKEN:-}"
      FLASHBACK_STORAGE_LIMIT: "${FLASHBACK_STORAGE_LIMIT:-}"
      FLASHBACK_MAX_ACCOUNTS: "${FLASHBACK_MAX_ACCOUNTS:-}"
      # Two roots: the portable files on their own mount, the databases on /data. Uncomment this and the mount below.
      # FLASHBACK_WORKSPACE_PATH: "/portable"
      # FLASHBACK_INDEX_PATH: "/cache"

    volumes:
      - flashback-data:/data
      # Split mounts. Copy the workspace out of flashback-data first, or the server serves an empty one.
      # Run `sudo chown -R 1000:1000 ./workspace` once before the first start.
      # - ${FLASHBACK_PORTABLE_DIR:-${FLASHBACK_CANONICAL_DIR:-./workspace}}:/portable
      # - flashback-cache:/cache

    # Shutdown flushes Seal and checkpoints the WAL.
    stop_grace_period: 30s

volumes:
  flashback-data:
  # flashback-cache:
