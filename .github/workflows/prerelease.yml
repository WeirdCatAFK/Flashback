name: Prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify: patch | minor | major | an explicit x.y.z'
        required: false
        default: 'patch'
        type: string

concurrency:
  group: prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: plan
        env:
          BUMP: ${{ inputs.version }}
        run: node scripts/release.js --dry-run "$BUMP"

  test:
    name: Tests
    uses: ./.github/workflows/test.yml

  installers:
    name: ${{ matrix.name }}
    needs: [plan, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (NSIS)
            build: npm run dist:win -- --publish never
            artifact: windows-nsis
            path: dist/*.exe
          - os: ubuntu-latest
            name: Linux (AppImage)
            build: npm run dist:linux -- --publish never
            artifact: linux-appimage
            path: dist/*.AppImage
          - os: macos-latest
            name: macOS (dmg, arm64)
            build: npm run dist:mac -- --publish never
            artifact: macos-dmg
            path: dist/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the installer
        run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          retention-days: 7
          if-no-files-found: error

  server:
    name: Server
    needs: [plan, test]
    uses: ./.github/workflows/server.yml
    with:
      upload: false

  verdict:
    name: Verdict
    if: always()
    needs: [plan, test, installers, server]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RESULTS: >-
            plan=${{ needs.plan.result }}
            tests=${{ needs.test.result }}
            installers=${{ needs.installers.result }}
            server=${{ needs.server.result }}
        run: |
          {
            echo "## Prerelease — v${VERSION:-?}"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            for pair in $RESULTS; do
              echo "| ${pair%%=*} | ${pair#*=} |"
            done
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for pair in $RESULTS; do
            [ "${pair#*=}" = "success" ] || failed=1
          done

          if [ "$failed" = "0" ]; then
            {
              echo "Everything a release runs is green on this commit, and no tag was created."
              echo
              echo '```'
              echo "npm run release -- ${VERSION:-patch}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Prerelease green — safe to tag v${VERSION}."
          else
            echo "**Do not tag.** Something above is not green." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Prerelease failed — do not run npm run release."
            exit 1
          fi
