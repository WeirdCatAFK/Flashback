name: Server

# The server artifacts: the Docker image, the standalone Linux zip and the two Windows zips.
#
# A reusable workflow (`workflow_call`) rather than a set of jobs, because two callers need
# exactly the same build-and-boot sequence and differ only in what happens at the end:
#
#   prerelease.yml  manual, before a tag, `upload: false` — verification only
#   release.yml     a `v*` tag,           `upload: true`  — the same, then publish: the zips
#                                                           to the draft, the image to GHCR
#
# Before this split the sequence lived only in release.yml, so a commit that broke the
# container or the zip stayed green until someone cut a tag — by which point the tag was
# already public. Copying the steps into the verification workflow would have closed that
# gap and opened a worse one: two copies of a two-hundred-line smoke test drift the first
# time either is edited. This file is the one copy.
#
# The verification caller used to be `build.yml`, which ran on every push. It is now
# `prerelease.yml`, which is dispatched by hand before a release — same call, same input,
# far fewer runner minutes. See the note at the top of prerelease.yml for the tradeoff.
#
# Ordering against the desktop installers is the CALLER's business, not this file's: the
# zips upload into a draft release that electron-builder creates, so release.yml gates its
# call on `needs: release`. Nothing here knows that.

on:
  workflow_call:
    inputs:
      upload:
        description: >-
          Publish what was built: attach the zips to the draft GitHub Release for the current
          tag, and push the container image to GHCR under that version and `latest`. Only a
          tag-triggered caller may set this — `gh release upload` addresses the release by
          $GITHUB_REF_NAME, which is a branch name on any other trigger. The workflow
          artifacts are kept either way, and nothing is pushed to the registry.
        type: boolean
        default: false

jobs:
  server-image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The real assertion here is that better-sqlite3 compiles against the image's Node.
      # It is a native addon, and a broken build surfaces at container start as a
      # NODE_MODULE_VERSION error — far too late to be useful.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flashback-server:ci

      # Boot it. An image that builds and then cannot open a vault has told us nothing, so
      # this starts a real container on a real volume and waits for the unauthenticated
      # readiness ping — the same one the HEALTHCHECK uses.
      - name: Boot the server and wait for readiness
        run: |
          docker run -d --name flashback-ci \
            -e FLASHBACK_VAULT_NAME=ci \
            -p 50500:50500 \
            flashback-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:50500/ >/dev/null 2>&1; then
              echo "ready after ${i}s"; break
            fi
            if [ "$i" = "30" ]; then echo "server never became ready"; docker logs flashback-ci; exit 1; fi
            sleep 1
          done

      - name: Require authentication on /api
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:50500/api/documents/list?path=")
          echo "anonymous /api -> $code"
          test "$code" = "401" || { docker logs flashback-ci; exit 1; }

      # A clean stop is what checkpoints the WAL; if SIGTERM handling regressed, this is
      # where it shows up rather than as a corrupted volume in production.
      - name: Stop cleanly
        run: |
          docker stop -t 30 flashback-ci
          docker logs flashback-ci 2>&1 | tail -20
          docker logs flashback-ci 2>&1 | grep -q "Shutdown complete" \
            || { echo "container did not shut down gracefully"; exit 1; }

      # ── Publish ──────────────────────────────────────────────────────────────────────
      #
      # What is pushed is the image the steps above BOOTED — retagged, never rebuilt. That is
      # what makes "nothing reaches the registry that did not start, answer a readiness ping
      # and refuse an anonymous caller" a property of this workflow rather than a hope. A
      # second build-push-action with `push: true` would produce a fresh image and assert
      # nothing whatsoever about it.
      #
      # `inputs.upload` gates these, exactly as the zip uploads are gated — but the real lock
      # is the caller's permissions. A reusable workflow runs with the permissions its caller
      # granted, and `prerelease.yml` grants `contents: read` and nothing else, so the
      # verification caller cannot push an image even if this input were set by mistake.
      #
      # amd64 only, deliberately. Multi-arch needs buildx with QEMU and cannot `load: true`,
      # so an arm64 image could not be started here — it would ship untested, which is the
      # one thing this job exists to prevent. If arm64 is wanted (plenty of home servers are),
      # add a second push step with `platforms: linux/amd64,linux/arm64` AFTER this one, so
      # the image that gates the release is still the one that was booted.
      - name: Log in to GHCR
        if: ${{ inputs.upload }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        if: ${{ inputs.upload }}
        run: |
          # An image reference must be lowercase, and the owner is not.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/$owner/flashback-server"

          # package.json, not the tag: release.yml has already refused to run if the two
          # disagree, and this is the version the running server reports on /api/vault.
          version=$(node -p "require('./package.json').version")

          echo "publishing $repo:$version and $repo:latest"
          for tag in "$version" latest; do
            docker tag flashback-server:ci "$repo:$tag"
            docker push "$repo:$tag"
          done

  server-zip:
    name: Standalone zip (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The artifact is platform-specific: better-sqlite3 is a compiled addon, so a Linux zip
      # can only be built on Linux. Until this job existed the zip had been built and tested
      # on Windows only, while Linux is the actual deployment target.
      - name: Build the zip
        run: npm run package:server

      - name: Unpack and check what shipped
        run: |
          cd dist-server
          zip=$(ls flashback-server-*-linux-x64.zip)
          unzip -q "$zip" -d extracted

          # Renamed to a fixed path so every later step can address it literally. The
          # alternative — passing the globbed directory forward through $GITHUB_ENV — is
          # cross-step state that only fails once it reaches a real runner, and there is
          # nothing here it buys.
          mv "extracted/$(ls extracted)" app
          dir=app
          ls -l "$dir"

          # The Windows build cannot set a Unix execute bit, so the mode is stamped into the
          # zip entry explicitly. If that regressed, the launcher is unrunnable and this is
          # the only place it would be noticed.
          test -x "$dir/flashback-server.sh" \
            || { echo "flashback-server.sh is not executable"; exit 1; }
          test ! -e "$dir/flashback-server.cmd" \
            || { echo "the Windows launcher should not be in a Linux artifact"; exit 1; }

      # PDF and EPUB are the formats that resolve package files at RUNTIME (pdfjs needs its
      # worker and standard_fonts; jsdom needs its own stylesheet). Both were broken in the
      # first bundle and both pass a markdown-only smoke test, so they are built here.
      - name: Build reader fixtures
        run: |
          node --input-type=module -e "
            import fs from 'fs';
            const { buildPdf, buildEpub } = await import('./tests/fixtures.js');
            fs.writeFileSync('/tmp/t.pdf', buildPdf([['Hello Flashback','page one']]));
            fs.writeFileSync('/tmp/t.epub', buildEpub([
              { href: 'c1.xhtml', title: 'Chapter One', body: '<h1>Chapter One</h1><p>readable</p>' },
            ]));
          "

      - name: Boot it via the shell launcher
        run: |
          cd dist-server/app
          FLASHBACK_PORT=50500 FLASHBACK_HOST=127.0.0.1 FLASHBACK_VAULT_NAME=ci \
            nohup ./flashback-server.sh > boot.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50500/ >/dev/null 2>&1; then echo "ready after ${i}s"; break; fi
            if [ "$i" = "60" ]; then echo "never became ready"; cat boot.log; exit 1; fi
            sleep 1
          done

      - name: Exercise the API
        run: |
          cd dist-server/app
          token=$(grep -A2 'AUTHOR TOKEN' boot.log | tail -1 | tr -d ' \r')
          test -n "$token" || { echo "no token was minted"; cat boot.log; exit 1; }
          cp /tmp/t.pdf /tmp/t.epub data/ci/workspace/

          check() {  # name, expected, url...
            code=$(curl -s -o /tmp/body -w '%{http_code}' "${@:3}")
            printf '  %-34s %s\n' "$1" "$code"
            test "$code" = "$2" || { echo "expected $2"; cat /tmp/body; exit 1; }
          }
          check "anonymous /api"      401 "http://127.0.0.1:50500/api/documents/list?path="
          check "authenticated /api"  200 -H "Authorization: Bearer $token" "http://127.0.0.1:50500/api/documents/list?path="
          check "vault/switch absent" 404 -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:50500/api/vault/switch"
          check "seal log"            200 -H "Authorization: Bearer $token" "http://127.0.0.1:50500/api/seal/log?depth=1"

          for fmt in pdf epub; do
            body=$(curl -s -H "Authorization: Bearer $token" "http://127.0.0.1:50500/api/reader/read?path=t.$fmt")
            echo "$body" | grep -q '"error"' && { echo "$fmt extraction failed: $body"; exit 1; }
            echo "  $fmt extraction ok"
          done

      # `exec` in the launcher means the shell is replaced by node, so SIGTERM reaches the
      # process that installed the handler.
      - name: Stop cleanly
        run: |
          cd dist-server/app
          kill -TERM "$(cat /tmp/server.pid)"
          for i in $(seq 1 30); do
            grep -q "Shutdown complete" boot.log && { echo "clean shutdown"; break; }
            if [ "$i" = "30" ]; then echo "no graceful shutdown"; tail -20 boot.log; exit 1; fi
            sleep 1
          done
          test ! -s data/ci/ci.db-wal || { echo "WAL was not checkpointed"; exit 1; }

      # Kept for seven days on EVERY caller, tag or not, so a commit can be put on a test box
      # without cutting a release. On a tag the same zip also goes to the draft below; this
      # copy is the one that exists for every other commit.
      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          path: dist-server/flashback-server-*-linux-x64.zip
          retention-days: 7
          if-no-files-found: error

      # Attached to the SAME draft the installers went to, so a server deployment is a
      # download from the Releases page rather than a 14-day workflow artifact. `gh` can
      # address a draft by its tag; --clobber makes a re-run of this job idempotent.
      - name: Attach the zip to the draft release
        if: ${{ inputs.upload }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-server/flashback-server-*-linux-x64.zip --clobber

  server-zip-windows:
    name: Standalone zip (Windows)
    runs-on: windows-latest
    # PowerShell throughout rather than the runner's Git Bash. The bash job's three load-bearing
    # verbs — `unzip`, `nohup`, `kill -TERM` — are exactly the ones that do not mean the same
    # thing on Windows, so copying its steps would look portable and behave differently.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Both variants, because a Windows box is far less likely to have Node 22 on PATH than a
      # Linux server is. They differ only in the embedded runtime and are named apart
      # (`-standalone`) so neither overwrites the other.
      - name: Build both zips
        run: |
          npm run package:server
          npm run package:server:standalone

      - name: Unpack and check what shipped
        run: |
          Set-Location dist-server
          $zip = (Get-ChildItem 'flashback-server-*-win32-x64.zip' | Where-Object { $_.Name -notlike '*standalone*' })[0]
          Expand-Archive -Path $zip.FullName -DestinationPath extracted
          # Fixed path so every later step can address it literally, exactly as the Linux job does.
          Move-Item (Get-ChildItem extracted -Directory)[0].FullName app
          Get-ChildItem app | Select-Object Name, Length

          # The mirror of the Linux job's assertion: one launcher, and it is this platform's.
          if (-not (Test-Path 'app/flashback-server.cmd')) { throw 'flashback-server.cmd is missing' }
          if (Test-Path 'app/flashback-server.sh') { throw 'the shell launcher should not be in a Windows artifact' }

          # The standalone variant's whole promise is that it needs nothing installed.
          $std = (Get-ChildItem 'flashback-server-*-win32-x64-standalone.zip')[0]
          Expand-Archive -Path $std.FullName -DestinationPath standalone
          $exe = Get-ChildItem standalone -Recurse -Filter node.exe
          if (-not $exe) { throw 'the standalone zip does not embed node.exe' }
          '  standalone embeds node.exe ({0:N1} MB)' -f ($exe[0].Length / 1MB)

      # PDF and EPUB are the formats that resolve package files at RUNTIME (pdfjs needs its
      # worker and standard_fonts; jsdom needs its own stylesheet from __dirname). Both pass a
      # markdown-only smoke test while being completely broken, so they are built here.
      - name: Build reader fixtures
        run: |
          New-Item -ItemType Directory -Force dist-server/app/data/ci/workspace | Out-Null
          node --input-type=module -e "
            import fs from 'fs';
            const { buildPdf, buildEpub } = await import('./tests/fixtures.js');
            const dir = 'dist-server/app/data/ci/workspace/';
            fs.writeFileSync(dir + 't.pdf', buildPdf([['Hello Flashback','page one']]));
            fs.writeFileSync(dir + 't.epub', buildEpub([
              { href: 'c1.xhtml', title: 'Chapter One', body: '<h1>Chapter One</h1><p>readable</p>' },
            ]));
          "

      # ONE step for the whole life of this server, where the Linux job uses three.
      #
      # A background process does not survive a step boundary on Windows the way it does on
      # Linux, and the two jobs' launch verbs are exactly where that difference lives:
      # `nohup ... &` detaches from the session, so the Linux server outlives the shell that
      # started it, while `Start-Process` leaves the child attached to the step's console and
      # to its process tree — both of which go away when the step's pwsh exits. The symptom was
      # precise about it: the boot step's readiness probe got its 200 and `GET / 200` is the
      # last line in boot.log, then the very next step found no node process at all, with
      # nothing further in the server's own logs. Nothing this server does exits silently
      # (every crash path logs a stack, SIGTERM logs "Shutdown complete", and both update-check
      # timers are unref'd), so "gone without a word" is something done TO it from outside.
      #
      # So each server here now boots, is exercised and is killed inside a single step. The
      # liveness check is `$server.HasExited` rather than `Get-Process node`: cmd.exe waits on
      # node, so the launcher's own exit is the exact signal, and it carries an exit code.
      #
      # Reading a status code is deliberately NOT done by catching the exception and digging
      # `$_.Exception.Response.StatusCode.value__` out of it. That idiom is Windows PowerShell
      # 5.1's shape (System.Net.WebException carrying an HttpWebResponse) and this job runs
      # pwsh 7, where a failing request throws an HttpResponseException carrying an
      # HttpResponseMessage instead — and where a connection-level failure carries no
      # `.Response` at all. Both produced an EMPTY code and the useless message
      # "anonymous /api expected 401, got ", with nothing said about the server. PowerShell 7's
      # own `-SkipHttpErrorCheck` makes a 4xx an ordinary response object, so the status is
      # read off the response and no exception shape is involved.
      - name: Boot it, exercise the API, and hard-kill it
        run: |
          $app = Resolve-Path dist-server/app

          function Dump-Logs {
            foreach ($f in 'boot.log', 'boot.err.log') {
              $p = Join-Path $app $f
              if (Test-Path $p) { Write-Host "-- $f --"; Get-Content $p | Write-Host }
            }
          }

          $env:FLASHBACK_PORT = '50500'
          $env:FLASHBACK_HOST = '127.0.0.1'
          $env:FLASHBACK_VAULT_NAME = 'ci'
          $server = Start-Process -FilePath "$app/flashback-server.cmd" -WorkingDirectory $app -PassThru -WindowStyle Hidden -RedirectStandardOutput "$app/boot.log" -RedirectStandardError "$app/boot.err.log"

          Write-Host '--- booting ---'
          foreach ($i in 1..60) {
            try {
              Invoke-WebRequest 'http://127.0.0.1:50500/' -UseBasicParsing -TimeoutSec 2 | Out-Null
              "ready after ${i}s"
              break
            } catch {
              # A launcher that has already exited will never answer; say so now rather than
              # spending a minute proving it.
              if ($server.HasExited) {
                Dump-Logs; throw "the server exited during startup with code $($server.ExitCode)"
              }
              if ($i -eq 60) { Dump-Logs; throw 'never became ready' }
              Start-Sleep -Seconds 1
            }
          }

          Write-Host '--- exercising the API ---'
          # Prove the server is still there BEFORE asserting anything about what it answers.
          # Without this, a process that died is indistinguishable from a wrong status code.
          if ($server.HasExited) {
            Dump-Logs; throw "the server exited with code $($server.ExitCode)"
          }
          try { Invoke-WebRequest 'http://127.0.0.1:50500/' -UseBasicParsing -TimeoutSec 10 | Out-Null }
          catch { Dump-Logs; throw "the server stopped answering: $($_.Exception.Message)" }

          $m = Select-String -Path "$app/boot.log" -Pattern '^\s*([0-9a-f]{64})\s*$'
          if (-not $m) { Dump-Logs; throw 'no token was minted' }
          $token = $m.Matches[0].Groups[1].Value
          $H = @{ Authorization = "Bearer $token" }

          function Check($name, $expected, $method, $url, $headers) {
            $r = Invoke-WebRequest -Uri $url -Method $method -Headers $headers `
                   -UseBasicParsing -TimeoutSec 120 -SkipHttpErrorCheck
            # Write-Host, not the output stream: this function RETURNS the response, and a
            # progress line written to output would be returned along with it.
            Write-Host ('  {0,-34} {1}' -f $name, $r.StatusCode)
            if ("$($r.StatusCode)" -ne "$expected") {
              Write-Host $r.Content
              Dump-Logs
              throw "$name expected $expected, got $($r.StatusCode)"
            }
            $r
          }
          Check 'anonymous /api'      401 GET  'http://127.0.0.1:50500/api/documents/list?path=' @{} | Out-Null
          Check 'authenticated /api'  200 GET  'http://127.0.0.1:50500/api/documents/list?path=' $H  | Out-Null
          Check 'vault/switch absent' 404 POST 'http://127.0.0.1:50500/api/vault/switch'        $H  | Out-Null
          Check 'seal log'            200 GET  'http://127.0.0.1:50500/api/seal/log?depth=1'    $H  | Out-Null

          foreach ($fmt in 'pdf', 'epub') {
            $r = Check "$fmt extraction" 200 GET "http://127.0.0.1:50500/api/reader/read?path=t.$fmt" $H
            if ($r.Content -match '"error"') { throw "$fmt extraction failed: $($r.Content)" }
          }

          # Windows has no signals. `Stop-Process` and `taskkill` map to TerminateProcess, so no
          # SIGTERM handler runs and "Shutdown complete" can never be asserted from outside the
          # console — Ctrl+C reaches the handler, but that is not drivable from CI. So the next
          # step asserts the property that actually matters after an ungraceful stop on Windows:
          # the vault recovers. The kill happens HERE, in the step that owns the process, and
          # leaves the whole database in an unread WAL (ci.db stays at 4 KB) for it to replay.
          Write-Host '--- hard kill ---'
          taskkill /PID $server.Id /T /F
          Start-Sleep -Seconds 2
          if (-not (Test-Path "$app/data/ci/ci.db-wal")) { throw 'expected an unchecked WAL after a hard kill' }
          '  killed, WAL left unchecked'

      # A second boot that lists both documents has genuinely replayed that WAL.
      - name: Reopen after the hard kill
        run: |
          $app = Resolve-Path dist-server/app

          function Dump-Logs {
            foreach ($f in 'boot2.log', 'boot2.err.log') {
              $p = Join-Path $app $f
              if (Test-Path $p) { Write-Host "-- $f --"; Get-Content $p | Write-Host }
            }
          }

          $env:FLASHBACK_PORT = '50500'
          $env:FLASHBACK_HOST = '127.0.0.1'
          $env:FLASHBACK_VAULT_NAME = 'ci'
          $server = Start-Process -FilePath "$app/flashback-server.cmd" -WorkingDirectory $app -PassThru -WindowStyle Hidden -RedirectStandardOutput "$app/boot2.log" -RedirectStandardError "$app/boot2.err.log"
          foreach ($i in 1..60) {
            try {
              Invoke-WebRequest 'http://127.0.0.1:50500/' -UseBasicParsing -TimeoutSec 2 | Out-Null
              "reopened after ${i}s"
              break
            } catch {
              # A WAL replay that dies takes the launcher with it — report the code, don't wait.
              if ($server.HasExited) {
                Dump-Logs; throw "the reopened server exited with code $($server.ExitCode)"
              }
              if ($i -eq 60) { Dump-Logs; throw 'never reopened' }
              Start-Sleep -Seconds 1
            }
          }

          # accounts.db is outside the vault and is the one store nothing can rebuild: the first
          # token must still work, and no second one may be minted.
          $token = (Select-String -Path "$app/boot.log" -Pattern '^\s*([0-9a-f]{64})\s*$').Matches[0].Groups[1].Value
          $r = Invoke-WebRequest 'http://127.0.0.1:50500/api/documents/list?path=' `
                 -Headers @{ Authorization = "Bearer $token" } -UseBasicParsing -SkipHttpErrorCheck
          if ($r.StatusCode -ne 200) {
            Dump-Logs; throw "the first token no longer works: $($r.StatusCode) $($r.Content)"
          }
          foreach ($doc in 't.pdf', 't.epub') {
            if ($r.Content -notmatch [regex]::Escape($doc)) { throw "$doc did not survive the hard kill: $($r.Content)" }
          }
          if (Select-String -Path "$app/boot2.log" -Pattern 'AUTHOR TOKEN') { throw 'a second token was minted — the accounts store did not persist' }
          '  vault and access list both survived'
          taskkill /PID $server.Id /T /F

      - name: Keep the zips as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-win32-x64
          path: dist-server/flashback-server-*-win32-x64*.zip
          retention-days: 7
          if-no-files-found: error

      # Both variants go to the SAME draft the installers and the Linux zip went to.
      # Pinned to this version rather than globbed loosely: `*-win32-x64*.zip` also matches an
      # older build sitting in dist-server, which is not possible on a fresh runner but is
      # exactly what happens when someone runs these steps locally. The count check turns a
      # renamed artifact into a failure here rather than a release that quietly ships one zip.
      - name: Attach the zips to the draft release
        if: ${{ inputs.upload }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zips = @(Get-ChildItem "dist-server/flashback-server-$v-win32-x64*.zip")
          $zips | ForEach-Object { '  {0}  {1:N1} MB' -f $_.Name, ($_.Length / 1MB) }
          if ($zips.Count -ne 2) { throw "expected 2 Windows zips for $v, found $($zips.Count)" }
          gh release upload "$env:GITHUB_REF_NAME" $zips.FullName --clobber
