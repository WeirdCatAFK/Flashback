# Flashback Server — a minimal, complete deployment.
#
#   docker compose up --build          build this checkout and run it
#   docker compose pull && up -d       run a published release (see Upgrading in docs/SERVER.md)
#
# On the FIRST start the log prints an author token, once. Copy it: the store keeps only its
# SHA-256, so it cannot be shown again. Then add the server as a remote in the desktop app.
#
# This file deliberately publishes on loopback only. Putting a TLS-terminating reverse proxy
# in front is not an optional hardening step — the API authenticates with a bearer token, and
# a token sent over plain HTTP across a network is a token you have given away. See
# docs/SERVER.md.
#
# ── Configuring this without editing this file ────────────────────────────────────────────
#
# Every value below is `${NAME:-default}`, so copy `.env.example` to `.env` BESIDE THIS FILE
# and edit that instead. Compose loads `./.env` on its own and substitutes here before the
# container is created.
#
# Interpolation rather than `env_file:`, and the choice is load-bearing:
#
#   - `environment:` entries WIN over `env_file:` entries. Using both would mean every key
#     named below silently ignores the same key in your `.env` — the exact failure this is
#     fixing, wearing a different hat.
#   - `env_file:` reaches the container only. `ports:` needs the port too, and a deployment
#     whose published port disagrees with the port the server binds is a deployment that
#     answers nothing.
#
# One mechanism, one precedence rule: your shell's environment beats `.env`, `.env` beats the
# defaults written here. (Inside the container there is a third, lowest, layer — `/data/.env`,
# read by `--env-file-if-exists`; it exists for `docker run -v`, where there is no Compose.)

services:
  flashback:
    build: .
    # A registry reference, so `docker compose pull` and pinning a version both work; `build:`
    # above is still what a clone uses. Compose builds when the image is not present locally
    # and pulls when asked, which lets one file serve both paths.
    image: ghcr.io/weirdcatafk/flashback-server:${FLASHBACK_VERSION:-latest}
    restart: unless-stopped

    # 127.0.0.1 on the host side: reachable by a reverse proxy on this machine, not by the
    # network. Change FLASHBACK_BIND_ADDR in `.env` only when something else is terminating
    # TLS in front of it.
    ports:
      - "${FLASHBACK_BIND_ADDR:-127.0.0.1}:${FLASHBACK_PORT:-50500}:${FLASHBACK_PORT:-50500}"

    environment:
      FLASHBACK_PORT: "${FLASHBACK_PORT:-50500}"
      FLASHBACK_HOST: "${FLASHBACK_HOST:-0.0.0.0}"   # inside the container; the port mapping is the boundary
      FLASHBACK_VAULT_NAME: "${FLASHBACK_VAULT_NAME:-shared}"

      # Who this server stamps its own work as. Set these BEFORE the first start: without
      # them the identity comes from the container's unix user, so documents and Seal
      # commits are authored by "node <node@flashback.local>" forever after.
      FLASHBACK_USER_NAME: "${FLASHBACK_USER_NAME:-Flashback Server}"
      FLASHBACK_USER_EMAIL: "${FLASHBACK_USER_EMAIL:-server@example.com}"

      # Browser origins allowed to call the API. Node clients (the MCP server, scripts) send
      # no Origin header and are gated by the token instead, so this list is only about
      # browsers. Loopback and the packaged renderer's `file://` origin are always allowed.
      FLASHBACK_ALLOWED_ORIGINS: "${FLASHBACK_ALLOWED_ORIGINS:-}"

      FLASHBACK_LOG_FORMAT: "${FLASHBACK_LOG_FORMAT:-combined}"

      # Whether the server asks GitHub, once a day, whether a newer release exists. It only
      # ever LOGS the answer — nothing here updates itself.
      FLASHBACK_UPDATE_CHECK: "${FLASHBACK_UPDATE_CHECK:-on}"

      # Supply your own author token instead of having one minted on first start. Put it in
      # `.env` (gitignored), never here — anything in this file is in your repo.
      #
      # Empty is not "set to nothing": serverConfig.js treats a whitespace-only variable as
      # unset, so the default below leaves first-start minting exactly as it was, and an
      # empty FLASHBACK_ALLOWED_ORIGINS leaves whatever config.json already holds alone.
      FLASHBACK_AUTHOR_TOKEN: "${FLASHBACK_AUTHOR_TOKEN:-}"

    # Everything the deployment owns lives here: config.json, accounts.db, and the vault
    # (workspace/, its git repo, the derived database, the diary).
    #
    # Back this up. `accounts.db` is the one store in the app that cannot be rebuilt from
    # anything — it holds who may reach this install AND every non-owner's study schedule.
    # The vault database is rebuildable by the Vault Doctor; the workspace is not.
    volumes:
      - flashback-data:/data

    # The default 10s is not enough: shutdown flushes Seal's pending commits and checkpoints
    # the WAL, and being killed mid-checkpoint is how a restart loses recent writes.
    stop_grace_period: 30s

volumes:
  flashback-data:
